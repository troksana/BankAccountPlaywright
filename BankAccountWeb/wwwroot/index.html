<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bank Account QA</title><style>body{font-family:Segoe UI,Arial,sans-serif;background:#f3f6fa;color:#1c2d3c;margin:0;padding:3rem 1rem}.panel{max-width:540px;margin:auto;background:white;border-radius:16px;padding:30px;box-shadow:0 10px 40px #20304018}h1{margin-top:0}.balance{font-size:2.2rem;font-weight:700;color:#176f66}label{display:block;margin:20px 0 8px}input{padding:12px;width:100%;box-sizing:border-box;border:1px solid #aab8c5;border-radius:8px;font-size:16px}.actions{display:flex;gap:10px;margin-top:16px}button{padding:12px 18px;border:0;border-radius:8px;background:#166c78;color:white;font-weight:600;cursor:pointer}button.secondary{background:#344c63}#message{min-height:25px;margin-top:16px}#message.error{color:#b3261e}#message.success{color:#176f66}</style></head><body><main class="panel"><h1>Bank Account Manager</h1><p>Current balance</p><div class="balance" data-testid="balance">Loading...</div><label for="amount">Amount (PLN)</label><input id="amount" type="number" step="0.01" placeholder="e.g. 50"/><div class="actions"><button id="deposit">Deposit</button><button id="withdraw" class="secondary">Withdraw</button></div><p id="message" role="status" aria-live="polite"></p></main><script src="/app.js"></script></body></html>
